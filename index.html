<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResumeAI — 上传简历，生成个人网站</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f; --surface: #12121a; --surface2: #1a1a28;
    --border: #2a2a3d; --accent: #7c6aff; --accent2: #a78bfa;
    --text: #e8e8f0; --muted: #6b7280; --success: #10b981; --radius: 14px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  nav { display: flex; align-items: center; justify-content: space-between; padding: 18px 40px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: rgba(10,10,15,0.85); backdrop-filter: blur(12px); z-index: 100; }
  .logo { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }
  .nav-badge { font-size: 11px; background: var(--accent); color: #fff; padding: 3px 10px; border-radius: 20px; font-weight: 600; }

  .hero { text-align: center; padding: 70px 20px 50px; }
  .hero-tag { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: 1px; color: var(--accent2); background: rgba(124,106,255,0.12); border: 1px solid rgba(124,106,255,0.3); padding: 5px 14px; border-radius: 20px; margin-bottom: 22px; text-transform: uppercase; }
  h1 { font-size: clamp(32px, 5vw, 58px); font-weight: 800; line-height: 1.1; letter-spacing: -1.5px; margin-bottom: 18px; }
  h1 em { font-style: normal; color: var(--accent2); }
  .hero-sub { color: var(--muted); font-size: 17px; max-width: 480px; margin: 0 auto 40px; }

  .steps { display: flex; align-items: center; justify-content: center; gap: 0; margin-bottom: 48px; }
  .step { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 500; color: var(--muted); padding: 8px 16px; transition: color 0.3s; }
  .step.active { color: var(--text); }
  .step.done { color: var(--success); }
  .step-num { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: var(--surface2); border: 1.5px solid var(--border); transition: all 0.3s; }
  .step.active .step-num { background: var(--accent); border-color: var(--accent); color: #fff; }
  .step.done .step-num { background: var(--success); border-color: var(--success); color: #fff; }
  .step-line { width: 40px; height: 1px; background: var(--border); }

  .main { max-width: 860px; margin: 0 auto; padding: 0 20px 80px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }

  #stepUpload { display: block; }
  #stepGenerating { display: none; }

  .upload-area { border: 2px dashed var(--border); border-radius: 10px; padding: 48px 32px; text-align: center; cursor: pointer; transition: all 0.2s; margin: 28px; background: var(--surface2); position: relative; }
  .upload-area:hover, .upload-area.dragover { border-color: var(--accent); background: rgba(124,106,255,0.06); }
  .upload-icon { font-size: 40px; margin-bottom: 14px; }
  .upload-area h3 { font-size: 16px; margin-bottom: 6px; }
  .upload-area p { color: var(--muted); font-size: 13px; }
  .upload-area input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .or-divider { display: flex; align-items: center; gap: 16px; margin: 0 28px; color: var(--muted); font-size: 13px; }
  .or-divider::before, .or-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .paste-area { margin: 16px 28px 28px; }
  .paste-area textarea { width: 100%; min-height: 160px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 14px; padding: 16px; resize: vertical; outline: none; font-family: inherit; line-height: 1.6; transition: border-color 0.2s; }
  .paste-area textarea:focus { border-color: var(--accent); }
  .paste-area textarea::placeholder { color: var(--muted); }

  .style-section { padding: 0 28px 28px; }
  .style-section label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 12px; font-weight: 500; }
  .style-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .style-option { border: 1.5px solid var(--border); border-radius: 10px; padding: 14px 12px; cursor: pointer; text-align: center; transition: all 0.2s; background: var(--surface2); }
  .style-option:hover { border-color: var(--accent2); }
  .style-option.selected { border-color: var(--accent); background: rgba(124,106,255,0.1); }
  .style-option .style-icon { font-size: 22px; margin-bottom: 6px; }
  .style-option .style-name { font-size: 12px; font-weight: 600; }
  .style-option .style-desc { font-size: 11px; color: var(--muted); margin-top: 3px; }

  .btn-primary { display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 13px 28px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; width: calc(100% - 56px); margin: 0 28px 28px; justify-content: center; }
  .btn-primary:hover { background: #6c5aef; transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .generating-view { padding: 60px 28px; text-align: center; }
  .gen-spinner { width: 64px; height: 64px; margin: 0 auto 28px; border-radius: 50%; border: 3px solid var(--border); border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .gen-title { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
  .gen-sub { color: var(--muted); font-size: 14px; margin-bottom: 32px; }
  .gen-log { background: var(--surface2); border-radius: 10px; padding: 16px 20px; text-align: left; font-size: 13px; font-family: 'SF Mono', 'Fira Code', monospace; border: 1px solid var(--border); max-width: 500px; margin: 0 auto; min-height: 120px; }
  .log-line { color: var(--muted); margin-bottom: 6px; opacity: 0; animation: fadein 0.4s ease forwards; }
  .log-line.ok { color: #34d399; }
  .log-line.working { color: var(--accent2); }
  .log-line.error { color: #f87171; }
  @keyframes fadein { to { opacity: 1; } }

  .extras-section { margin: 0 28px 4px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .extras-toggle { width: 100%; background: var(--surface2); border: none; color: var(--muted); padding: 11px 16px; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: color 0.2s; }
  .extras-toggle:hover { color: var(--text); }
  #extrasArrow { font-size: 18px; transition: transform 0.2s; line-height: 1; }
  #extrasArrow.open { transform: rotate(90deg); }
  .extras-body { display: none; padding: 16px; border-top: 1px solid var(--border); background: var(--surface); }
  .extras-body.open { display: block; }
  .extras-item { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .extras-item:last-child { margin-bottom: 0; }
  .extras-label { font-size: 12px; color: var(--muted); font-weight: 500; width: 80px; flex-shrink: 0; }
  .extras-input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; padding: 8px 12px; outline: none; transition: border-color 0.2s; }
  .extras-input:focus { border-color: var(--accent); }
  .extras-input::placeholder { color: var(--muted); }
  .extras-upload-row { display: flex; align-items: center; gap: 14px; flex: 1; }
  .photo-preview { width: 48px; height: 48px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; overflow: hidden; }
  .upload-btn-small { display: inline-block; font-size: 12px; font-weight: 500; color: var(--accent2); border: 1px solid rgba(124,106,255,0.3); border-radius: 6px; padding: 5px 12px; cursor: pointer; background: rgba(124,106,255,0.08); transition: background 0.2s; }
  .upload-btn-small:hover { background: rgba(124,106,255,0.16); }
  .file-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(124,106,255,0.12); border: 1px solid rgba(124,106,255,0.3); border-radius: 8px; padding: 6px 14px; font-size: 13px; margin: 16px 28px 0; color: var(--accent2); }
  .card-header { padding: 20px 28px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .card-header h2 { font-size: 16px; font-weight: 600; }
  .card-header .step-badge { font-size: 11px; background: var(--accent); color: #fff; padding: 2px 8px; border-radius: 4px; font-weight: 700; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 20px; font-size: 14px; font-weight: 500; box-shadow: 0 10px 40px rgba(0,0,0,0.5); transform: translateY(80px); opacity: 0; transition: all 0.35s cubic-bezier(0.34,1.56,0.64,1); z-index: 999; display: flex; align-items: center; gap: 10px; max-width: 320px; }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.error { border-color: rgba(248,113,113,0.4); }
</style>
</head>
<body>

<nav>
  <div class="logo">Resume<span>AI</span></div>
  <div class="nav-badge">Beta</div>
</nav>

<div class="hero">
  <div class="hero-tag">✨ AI Powered</div>
  <h1>上传简历<br><em>秒生成个人网站</em></h1>
  <p class="hero-sub">AI 解析你的简历，自动生成专属个人主页，一键发布上线</p>
  <div class="steps">
    <div class="step active" id="stepind1"><div class="step-num">1</div>上传简历</div>
    <div class="step-line"></div>
    <div class="step" id="stepind2"><div class="step-num">2</div>AI 生成</div>
    <div class="step-line"></div>
    <div class="step" id="stepind3"><div class="step-num">3</div>预览发布</div>
  </div>
</div>

<div class="main">

  <!-- STEP 1: UPLOAD -->
  <div class="card" id="stepUpload">
    <div class="card-header">
      <span class="step-badge">步骤 1</span>
      <h2>上传你的简历</h2>
    </div>

    <input type="hidden" id="backendUrl" value="http://localhost:8000">

    <div class="upload-area" id="uploadArea">
      <input type="file" accept=".pdf,.doc,.docx,.txt" id="fileInput" onchange="handleFile(this)">
      <div class="upload-icon">📄</div>
      <h3>点击或拖拽上传简历</h3>
      <p>支持 PDF、Word、TXT 格式</p>
    </div>

    <div id="fileBadge" style="display:none">
      <div class="file-badge">
        📎 <span id="fileName"></span>
        <span id="parseStatus" style="margin-left:8px;font-size:11px;opacity:0.7"></span>
      </div>
    </div>

    <textarea id="resumeText" style="display:none"></textarea>

    <!-- Optional extras -->
    <div class="extras-section" style="margin-top:16px">
      <button class="extras-toggle" onclick="toggleExtras()">
        <span>✦ 添加可选信息（头像、LinkedIn 等）</span>
        <span id="extrasArrow">›</span>
      </button>
      <div class="extras-body" id="extrasBody">
        <div class="extras-item">
          <div class="extras-label">头像</div>
          <div class="extras-upload-row">
            <div class="photo-preview" id="photoPreview">
              <span id="photoIcon">👤</span>
              <img id="photoImg" style="display:none; width:100%; height:100%; object-fit:cover; border-radius:50%;">
            </div>
            <div>
              <label class="upload-btn-small">
                上传图片
                <input type="file" accept="image/*" id="photoInput" style="display:none" onchange="handlePhoto(this)">
              </label>
              <div style="font-size:11px;color:var(--muted);margin-top:4px">JPG / PNG，建议正方形</div>
            </div>
          </div>
        </div>
        <div class="extras-item">
          <div class="extras-label">LinkedIn</div>
          <input type="url" id="linkedinUrl" class="extras-input" placeholder="https://linkedin.com/in/your-name">
        </div>
        <div class="extras-item">
          <div class="extras-label">Google Scholar</div>
          <input type="url" id="scholarUrl" class="extras-input" placeholder="https://scholar.google.com/citations?user=...">
        </div>
        <div class="extras-item">
          <div class="extras-label">个人网址</div>
          <input type="url" id="websiteUrl" class="extras-input" placeholder="https://yourwebsite.com">
        </div>
      </div>
    </div>

    <!-- Style picker -->
    <div class="style-section" style="margin-top:16px">
      <label>🎨 选择网站风格</label>
      <div class="style-grid">
        <div class="style-option selected" onclick="selectStyle(this,'minimal')">
          <div class="style-icon">🖤</div>
          <div class="style-name">极简</div>
          <div class="style-desc">简洁黑白，专业感强</div>
        </div>
        <div class="style-option" onclick="selectStyle(this,'creative')">
          <div class="style-icon">🎨</div>
          <div class="style-name">创意</div>
          <div class="style-desc">彩色渐变，个性十足</div>
        </div>
        <div class="style-option" onclick="selectStyle(this,'tech')">
          <div class="style-icon">💻</div>
          <div class="style-name">科技</div>
          <div class="style-desc">暗黑风格，极客气质</div>
        </div>
      </div>
    </div>

    <button class="btn-primary" id="generateBtn" onclick="startGenerate()">
      ✨ 生成我的个人网站
    </button>
  </div>

  <!-- STEP 2: GENERATING -->
  <div class="card" id="stepGenerating">
    <div class="generating-view">
      <div class="gen-spinner"></div>
      <div class="gen-title">AI 正在生成你的网站...</div>
      <div class="gen-sub">通常需要 10–20 秒，请稍候</div>
      <div class="gen-log" id="genLog"></div>
    </div>
  </div>

</div>

<div class="toast" id="toast">
  <span id="toastIcon">⚠️</span>
  <span id="toastMsg"></span>
</div>

<script>
  // ── state ──────────────────────────────────────────────────────────────────
  let selectedStyle = 'minimal';
  let photoBase64   = '';

  // ── drag & drop ────────────────────────────────────────────────────────────
  const uploadArea = document.getElementById('uploadArea');
  uploadArea.addEventListener('dragover',  e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
  uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
  uploadArea.addEventListener('drop', e => {
    e.preventDefault();
    uploadArea.classList.remove('dragover');
    const f = e.dataTransfer.files[0];
    if (f) processFile(f);
  });

  // ── file handling ──────────────────────────────────────────────────────────
  function handleFile(input) {
    if (input.files[0]) processFile(input.files[0]);
  }

  async function processFile(file) {
    const badge  = document.getElementById('fileBadge');
    const nameEl = document.getElementById('fileName');
    const status = document.getElementById('parseStatus');
    badge.style.display = 'block';
    nameEl.textContent  = file.name;
    status.textContent  = '解析中...';

    const backend = document.getElementById('backendUrl').value;
    const fd = new FormData();
    fd.append('file', file);
    try {
      const res  = await fetch(`${backend}/upload-resume`, { method: 'POST', body: fd });
      const data = await res.json();
      document.getElementById('resumeText').value = data.text || '';
      status.textContent = '✓ 解析完成';
    } catch(e) {
      status.textContent = '解析失败，请手动粘贴';
    }
  }

  function handlePhoto(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      photoBase64 = e.target.result;
      document.getElementById('photoImg').src = photoBase64;
      document.getElementById('photoImg').style.display = 'block';
      document.getElementById('photoIcon').style.display = 'none';
    };
    reader.readAsDataURL(file);
  }

  function selectStyle(el, val) {
    document.querySelectorAll('.style-option').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
    selectedStyle = val;
  }

  function toggleExtras() {
    const body  = document.getElementById('extrasBody');
    const arrow = document.getElementById('extrasArrow');
    body.classList.toggle('open');
    arrow.classList.toggle('open');
  }

  // ── generate ───────────────────────────────────────────────────────────────
  function log(msg, cls='') {
    const el = document.createElement('div');
    el.className = 'log-line' + (cls ? ' ' + cls : '');
    el.textContent = msg;
    document.getElementById('genLog').appendChild(el);
  }

  async function startGenerate() {
    const resumeText = document.getElementById('resumeText').value.trim()
      || document.querySelector('.paste-area textarea')?.value.trim() || '';

    if (!resumeText) { showToast('请先上传简历或粘贴简历内容', '⚠️'); return; }

    // Switch to generating view
    document.getElementById('stepUpload').style.display    = 'none';
    document.getElementById('stepGenerating').style.display = 'block';
    document.getElementById('stepind1').classList.remove('active');
    document.getElementById('stepind1').classList.add('done');
    document.getElementById('stepind2').classList.add('active');

    const logEl = document.getElementById('genLog');
    logEl.innerHTML = '';
    log('▶ 解析简历内容...', 'working');
    setTimeout(() => log('▶ 调用 GPT-4o 生成网站...', 'working'), 800);
    setTimeout(() => log('▶ 注入 AI 定制助手...', 'working'), 2500);

    const backend = document.getElementById('backendUrl').value;
    const payload = {
      resume_text:   resumeText,
      style:         selectedStyle,
      linkedin_url:  document.getElementById('linkedinUrl').value.trim(),
      scholar_url:   document.getElementById('scholarUrl').value.trim(),
      website_url:   document.getElementById('websiteUrl').value.trim(),
    };

    try {
      const res  = await fetch(`${backend}/generate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `HTTP ${res.status}`);
      }
      const data = await res.json();
      let html = data.html;

      // Inject profile photo if provided
      if (photoBase64) {
        const imgTag = document.getElementById('photoImg');
        if (html.includes('id="profile-photo"')) {
          html = html.replace(/id="profile-photo"[^>]*>/, `id="profile-photo" src="${photoBase64}" style="border-radius:50%;object-fit:cover;">`);
        }
      }

      log('✓ 生成完成！正在跳转到预览页...', 'ok');

      // Persist to localStorage then navigate
      const result = { html, slug: data.slug, name: data.name, style: selectedStyle };
      localStorage.setItem('resumeai_result', JSON.stringify(result));

      setTimeout(() => {
        window.location.href = 'preview.html';
      }, 800);

    } catch(e) {
      log('✗ 错误：' + e.message, 'error');
      document.getElementById('stepGenerating').style.display = 'none';
      document.getElementById('stepUpload').style.display     = 'block';
      document.getElementById('stepind1').classList.remove('done');
      document.getElementById('stepind1').classList.add('active');
      document.getElementById('stepind2').classList.remove('active');
      showToast('生成失败：' + e.message, '❌');
    }
  }

  // ── toast ──────────────────────────────────────────────────────────────────
  function showToast(msg, icon='⚠️') {
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').textContent  = msg;
    document.getElementById('toastIcon').textContent = icon;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
  }
</script>
</body>
</html>
