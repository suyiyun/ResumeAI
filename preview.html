<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResumeAI — 预览与发布</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f; --surface: #12121a; --surface2: #1a1a28;
    --border: #2a2a3d; --accent: #7c6aff; --accent2: #a78bfa;
    --text: #e8e8f0; --muted: #6b7280; --success: #10b981; --radius: 14px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

  nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 40px; border-bottom: 1px solid var(--border); background: rgba(10,10,15,0.9); backdrop-filter: blur(12px); z-index: 100; }
  .logo { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }
  .nav-back { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); background: none; border: none; cursor: pointer; padding: 6px 12px; border-radius: 8px; transition: color 0.2s, background 0.2s; }
  .nav-back:hover { color: var(--text); background: var(--surface2); }

  .steps { display: flex; align-items: center; justify-content: center; gap: 0; padding: 28px 20px 24px; }
  .step { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 500; color: var(--muted); padding: 8px 16px; }
  .step.active { color: var(--text); }
  .step.done { color: var(--success); }
  .step-num { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: var(--surface2); border: 1.5px solid var(--border); }
  .step.active .step-num { background: var(--accent); border-color: var(--accent); color: #fff; }
  .step.done .step-num { background: var(--success); border-color: var(--success); color: #fff; }
  .step-line { width: 40px; height: 1px; background: var(--border); }

  .main { max-width: 960px; margin: 0 auto; padding: 0 20px 60px; width: 100%; }

  /* no result state */
  .empty-state { text-align: center; padding: 80px 20px; color: var(--muted); }
  .empty-state h2 { font-size: 22px; font-weight: 600; color: var(--text); margin-bottom: 12px; }
  .empty-state p { margin-bottom: 28px; font-size: 15px; }

  /* preview card */
  .preview-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }

  .preview-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--surface2); gap: 12px; flex-wrap: wrap; }
  .preview-header-left { display: flex; align-items: center; gap: 10px; }
  .preview-header h3 { font-size: 15px; font-weight: 600; }
  .preview-name { font-size: 13px; color: var(--muted); }

  /* responsive toggle */
  .device-btns { display: flex; gap: 4px; }
  .device-btn { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; transition: all 0.2s; }
  .device-btn.active { border-color: var(--accent); color: var(--accent2); background: rgba(124,106,255,0.1); }

  .preview-wrapper { background: #e5e5e5; padding: 0; min-height: 540px; display: flex; align-items: flex-start; justify-content: center; transition: padding 0.3s; }
  .preview-wrapper.mobile { padding: 20px; }
  .preview-wrapper.tablet { padding: 20px; }

  #previewFrame { width: 100%; height: 560px; background: #fff; border: none; display: block; transition: width 0.3s, height 0.3s; }
  .preview-wrapper.mobile  #previewFrame { width: 390px; height: 844px; border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
  .preview-wrapper.tablet  #previewFrame { width: 768px; height: 640px; border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }

  /* slug + publish row */
  .publish-area { padding: 20px 24px; border-top: 1px solid var(--border); background: var(--surface2); }
  .slug-row { display: flex; align-items: center; gap: 0; margin-bottom: 16px; }
  .slug-prefix { font-size: 13px; color: var(--muted); font-family: monospace; background: var(--surface); border: 1px solid var(--border); border-right: none; border-radius: 8px 0 0 8px; padding: 9px 12px; white-space: nowrap; }
  #slugInput { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 0 8px 8px 0; color: var(--text); font-size: 13px; font-family: monospace; padding: 9px 12px; outline: none; max-width: 220px; transition: border-color 0.2s; }
  #slugInput:focus { border-color: var(--accent); }
  #slugInput::placeholder { color: var(--muted); }

  .actions-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .btn-secondary { display: inline-flex; align-items: center; gap: 7px; background: transparent; color: var(--text); border: 1.5px solid var(--border); border-radius: 10px; padding: 10px 18px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
  .btn-secondary:hover { border-color: var(--accent2); color: var(--accent2); }
  .spacer { flex: 1; }
  .btn-publish { display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 11px 26px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
  .btn-publish:hover { background: #6c5aef; transform: translateY(-1px); }
  .btn-publish:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* published banner */
  .published-banner { background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.25); border-radius: 10px; padding: 14px 18px; display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .published-banner .pub-icon { font-size: 22px; flex-shrink: 0; }
  .pub-details { flex: 1; min-width: 0; }
  .pub-details h4 { font-size: 14px; font-weight: 600; color: #34d399; margin-bottom: 5px; }
  .pub-link-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pub-link { color: var(--accent2); text-decoration: none; font-size: 13px; font-weight: 500; word-break: break-all; }
  .pub-link:hover { text-decoration: underline; }
  .copy-btn { font-size: 11px; background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.3); color: #34d399; border-radius: 5px; padding: 3px 10px; cursor: pointer; white-space: nowrap; transition: background 0.2s; }
  .copy-btn:hover { background: rgba(16,185,129,0.22); }

  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 20px; font-size: 14px; font-weight: 500; box-shadow: 0 10px 40px rgba(0,0,0,0.5); transform: translateY(80px); opacity: 0; transition: all 0.35s cubic-bezier(0.34,1.56,0.64,1); z-index: 999; display: flex; align-items: center; gap: 10px; max-width: 320px; }
  .toast.show { transform: translateY(0); opacity: 1; }

  .btn-back-hero { display: inline-flex; align-items: center; gap: 7px; background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 12px 24px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .btn-back-hero:hover { background: #6c5aef; }

  /* AI 定制按钮 */
  .btn-ai { display: inline-flex; align-items: center; gap: 7px; background: linear-gradient(135deg, #7c6aff, #a78bfa); color: #fff; border: none; border-radius: 10px; padding: 10px 18px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
  .btn-ai:hover { opacity: 0.85; transform: translateY(-1px); }

  /* 右侧聊天面板 */
  #chatPanel {
    position: fixed; top: 0; right: -420px; width: 400px; height: 100vh;
    background: var(--surface); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; z-index: 500;
    transition: right 0.35s cubic-bezier(0.4,0,0.2,1);
    box-shadow: -10px 0 40px rgba(0,0,0,0.4);
  }
  #chatPanel.open { right: 0; }

  .chat-panel-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--border); background: var(--surface2); flex-shrink: 0; }
  .chat-panel-header h4 { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .chat-close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: color 0.2s, background 0.2s; line-height: 1; }
  .chat-close:hover { color: var(--text); background: var(--surface); }

  .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .chat-msg { max-width: 88%; padding: 10px 14px; border-radius: 12px; font-size: 13.5px; line-height: 1.5; }
  .chat-msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-radius: 12px 12px 2px 12px; }
  .chat-msg.assistant { align-self: flex-start; background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 12px 12px 12px 2px; }
  .chat-msg.thinking { color: var(--muted); font-style: italic; }

  .chat-input-area { padding: 10px 16px 14px; border-top: 1px solid var(--border); background: var(--surface2); flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }
  .chat-input-row { display: flex; gap: 8px; align-items: flex-end; }
  #chatInput { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 13.5px; padding: 10px 14px; outline: none; resize: none; min-height: 40px; max-height: 120px; font-family: inherit; transition: border-color 0.2s; line-height: 1.45; }
  #chatInput:focus { border-color: var(--accent); }
  #chatInput::placeholder { color: var(--muted); }
  .chat-send { background: var(--accent); border: none; color: #fff; border-radius: 10px; padding: 10px 16px; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; white-space: nowrap; flex-shrink: 0; }
  .chat-send:hover { opacity: 0.85; }
  .chat-send:disabled { opacity: 0.4; cursor: not-allowed; }
  .chat-upload-btn { background: none; border: 1.5px solid var(--border); color: var(--muted); border-radius: 10px; padding: 9px 11px; font-size: 15px; cursor: pointer; transition: all 0.2s; flex-shrink: 0; line-height: 1; }
  .chat-upload-btn:hover { border-color: var(--accent2); color: var(--accent2); }
  /* 图片预览条 */
  #chatImagePreview { display: none; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 12px; color: var(--muted); }
  #chatImagePreview.show { display: flex; }
  #chatImageThumb { width: 32px; height: 32px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
  #chatImageName { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-img-remove { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 0 2px; line-height: 1; }
  .chat-img-remove:hover { color: #f87171; }

  /* 遮罩 */
  #chatOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 499; }
  #chatOverlay.show { display: block; }
</style>
</head>
<body>

<nav>
  <div class="logo">Resume<span>AI</span></div>
  <button class="nav-back" onclick="goBack()">← 重新上传</button>
</nav>

<div class="steps">
  <div class="step done"><div class="step-num">1</div>上传简历</div>
  <div class="step-line"></div>
  <div class="step done"><div class="step-num">2</div>AI 生成</div>
  <div class="step-line"></div>
  <div class="step active"><div class="step-num">3</div>预览发布</div>
</div>

<div class="main">

  <!-- empty state: no data in localStorage -->
  <div id="emptyState" class="empty-state" style="display:none">
    <h2>没有找到生成结果</h2>
    <p>请先上传简历并生成网站</p>
    <button class="btn-back-hero" onclick="goBack()">← 返回上传页面</button>
  </div>

  <!-- preview card (shown when result exists) -->
  <div id="previewCard" class="preview-card" style="display:none">
    <div class="preview-header">
      <div class="preview-header-left">
        <h3>🌐 网站预览</h3>
        <span class="preview-name" id="previewName"></span>
      </div>
      <div class="device-btns">
        <button class="device-btn active" onclick="setDevice('desktop',this)" title="桌面端">🖥 桌面</button>
        <button class="device-btn" onclick="setDevice('tablet',this)" title="平板">📱 平板</button>
        <button class="device-btn" onclick="setDevice('mobile',this)" title="手机">📱 手机</button>
      </div>
    </div>

    <div class="preview-wrapper" id="previewWrapper">
      <iframe id="previewFrame" srcdoc="" title="网站预览"></iframe>
    </div>

    <div class="publish-area">
      <div class="slug-row">
        <span class="slug-prefix">resumeai.app/u/</span>
        <input id="slugInput" type="text" placeholder="your-name" maxlength="40"
          oninput="this.value=this.value.toLowerCase().replace(/[^a-z0-9-]/g,'-').replace(/-+/g,'-')">
      </div>

      <div class="actions-row">
        <button class="btn-secondary" onclick="goBack()">← 重新生成</button>
        <button class="btn-secondary" onclick="downloadHTML()">⬇ 下载 HTML</button>
        <button class="btn-secondary" onclick="openFullscreen()">↗ 全屏预览</button>
        <button class="btn-ai" onclick="openChat()">✦ AI 定制</button>
        <div class="spacer"></div>
        <button class="btn-publish" id="publishBtn" onclick="publish()">🚀 发布上线</button>
      </div>

      <div id="publishedBanner" style="display:none">
        <div class="published-banner">
          <div class="pub-icon">🎉</div>
          <div class="pub-details">
            <h4>已成功发布！</h4>
            <div class="pub-link-row">
              <a class="pub-link" id="publishedLink" href="#" target="_blank"></a>
              <button class="copy-btn" onclick="copyLink()">复制链接</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- 右侧 AI 聊天面板 -->
<div id="chatOverlay" onclick="closeChat()"></div>
<div id="chatPanel">
  <div class="chat-panel-header">
    <h4>✦ AI 定制</h4>
    <button class="chat-close" onclick="closeChat()">✕</button>
  </div>
  <div class="chat-messages" id="chatMessages">
    <div class="chat-msg assistant">你好！告诉我你想修改什么，我来帮你调整网站。例如：「把主色改成蓝色」「在顶部加一个动画」「字体改成更现代的」</div>
  </div>
  <div class="chat-input-area">
    <div id="chatImagePreview">
      <img id="chatImageThumb" src="" alt="预览">
      <span id="chatImageName"></span>
      <button class="chat-img-remove" onclick="removeImage()" title="移除图片">✕</button>
    </div>
    <div class="chat-input-row">
      <button class="chat-upload-btn" onclick="document.getElementById('chatFileInput').click()" title="上传图片">📎</button>
      <textarea id="chatInput" placeholder="描述你想改什么…" rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"
        oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea>
      <button class="chat-send" id="chatSendBtn" onclick="sendChat()">发送</button>
    </div>
    <input id="chatFileInput" type="file" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
  </div>
</div>

<div class="toast" id="toast">
  <span id="toastIcon">✅</span>
  <span id="toastMsg"></span>
</div>

<script>
  const BACKEND = 'http://localhost:8000';

  // ── strip legacy injected chatbox ──────────────────────────────────────────
  function stripChatbox(html) {
    // Remove the block between the two comment markers (inclusive)
    return html.replace(/<!-- ResumeAI Chatbox -->[\s\S]*?<!-- \/ResumeAI Chatbox -->/g, '');
  }

  // ── load result from localStorage ─────────────────────────────────────────
  let currentHTML  = '';
  let currentSlug  = '';
  let publishedUrl = '';

  function init() {
    const raw = localStorage.getItem('resumeai_result');
    if (!raw) {
      document.getElementById('emptyState').style.display  = 'block';
      return;
    }
    try {
      const result = JSON.parse(raw);
      currentHTML  = stripChatbox(result.html  || '');
      currentSlug  = result.slug  || '';
      const name   = result.name  || 'portfolio';

      document.getElementById('previewCard').style.display = 'block';
      document.getElementById('previewName').textContent   = name;
      document.getElementById('slugInput').value           = slugify(name);
      document.getElementById('previewFrame').srcdoc       = currentHTML;
    } catch(e) {
      document.getElementById('emptyState').style.display = 'block';
    }
  }

  function slugify(str) {
    return str.toLowerCase()
      .replace(/[一-龥]/g, '')   // strip Chinese
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      || 'portfolio';
  }

  // ── device toggle ──────────────────────────────────────────────────────────
  function setDevice(mode, btn) {
    const wrapper = document.getElementById('previewWrapper');
    wrapper.className = 'preview-wrapper ' + (mode === 'desktop' ? '' : mode);
    document.querySelectorAll('.device-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  // ── actions ────────────────────────────────────────────────────────────────
  function goBack() {
    window.location.href = 'index.html';
  }

  function openFullscreen() {
    const blob = new Blob([currentHTML], { type: 'text/html' });
    window.open(URL.createObjectURL(blob), '_blank');
  }

  function downloadHTML() {
    const name = document.getElementById('slugInput').value || 'portfolio';
    const blob = new Blob([currentHTML], { type: 'text/html' });
    const a    = document.createElement('a');
    a.href     = URL.createObjectURL(blob);
    a.download = name + '.html';
    a.click();
  }

  async function publish() {
    const slug = (document.getElementById('slugInput').value || currentSlug).trim();
    if (!slug) { showToast('请输入一个 URL 名称', '⚠️'); return; }

    const btn = document.getElementById('publishBtn');
    btn.disabled    = true;
    btn.textContent = '发布中...';

    try {
      const res  = await fetch(`${BACKEND}/publish`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ slug, html: currentHTML })
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `HTTP ${res.status}`);
      }
      const data   = await res.json();
      publishedUrl = data.url;

      document.getElementById('publishedBanner').style.display = 'block';
      document.getElementById('publishedLink').href            = publishedUrl;
      document.getElementById('publishedLink').textContent     = publishedUrl;

      // Update localStorage with final slug
      try {
        const saved  = JSON.parse(localStorage.getItem('resumeai_result') || '{}');
        saved.slug   = slug;
        saved.pubUrl = publishedUrl;
        localStorage.setItem('resumeai_result', JSON.stringify(saved));
      } catch(_) {}

      showToast('发布成功！', '🎉');
      btn.textContent = '✓ 已发布';
    } catch(e) {
      showToast('发布失败：' + e.message, '❌');
      btn.disabled    = false;
      btn.textContent = '🚀 发布上线';
    }
  }

  function copyLink() {
    if (!publishedUrl) return;
    navigator.clipboard.writeText(publishedUrl).then(() => showToast('链接已复制！', '✅'));
  }

  function showToast(msg, icon='✅') {
    document.getElementById('toastMsg').textContent  = msg;
    document.getElementById('toastIcon').textContent = icon;
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ── AI 定制聊天 ────────────────────────────────────────────────────────────
  let chatHistory = [];
  let pendingImageBase64 = ''; // data URI of the image to attach next send

  function loadChatHistory() {
    try {
      const saved = JSON.parse(localStorage.getItem('resumeai_chat') || '[]');
      chatHistory = saved;
      const container = document.getElementById('chatMessages');
      saved.forEach(h => {
        if (h.role === 'user' || h.role === 'assistant') {
          appendMessage(h.role, h.content, false);
        }
      });
    } catch(_) {}
  }

  function saveChatHistory() {
    try {
      localStorage.setItem('resumeai_chat', JSON.stringify(chatHistory));
    } catch(_) {}
  }

  function appendMessage(role, text, scroll=true) {
    const container = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = 'chat-msg ' + role;
    div.textContent = text;
    container.appendChild(div);
    if (scroll) container.scrollTop = container.scrollHeight;
    return div;
  }

  function handleImageUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    // Limit to 5 MB
    if (file.size > 5 * 1024 * 1024) {
      showToast('图片不能超过 5MB', '⚠️');
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      pendingImageBase64 = e.target.result; // data URI
      document.getElementById('chatImageThumb').src = pendingImageBase64;
      document.getElementById('chatImageName').textContent = file.name;
      document.getElementById('chatImagePreview').classList.add('show');
    };
    reader.readAsDataURL(file);
    // Reset input so same file can be re-selected
    event.target.value = '';
  }

  function removeImage() {
    pendingImageBase64 = '';
    document.getElementById('chatImagePreview').classList.remove('show');
    document.getElementById('chatImageThumb').src = '';
    document.getElementById('chatImageName').textContent = '';
  }

  function openChat() {
    document.getElementById('chatPanel').classList.add('open');
    document.getElementById('chatOverlay').classList.add('show');
    document.getElementById('chatInput').focus();
  }

  function closeChat() {
    document.getElementById('chatPanel').classList.remove('open');
    document.getElementById('chatOverlay').classList.remove('show');
  }

  async function sendChat() {
    const input = document.getElementById('chatInput');
    const msg = input.value.trim();
    if (!msg) return;

    const sendBtn = document.getElementById('chatSendBtn');
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    appendMessage('user', msg);
    chatHistory.push({ role: 'user', content: msg });

    const thinking = appendMessage('assistant', '正在修改中…');
    thinking.classList.add('thinking');

    try {
      // Snapshot and clear pending image before the async call
      const imageToSend = pendingImageBase64;
      if (imageToSend) removeImage();

      const res = await fetch(`${BACKEND}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          html: currentHTML,
          message: msg,
          history: chatHistory.slice(-6),
          image_base64: imageToSend
        })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `HTTP ${res.status}`);
      }

      const data = await res.json();
      thinking.remove();

      // 替换图片占位符（如果本轮携带了图片）
      let newHtml = data.html;
      if (imageToSend) {
        newHtml = newHtml.split('__USER_IMAGE__').join(imageToSend);
      }

      // 更新 HTML
      currentHTML = newHtml;
      document.getElementById('previewFrame').srcdoc = newHtml;

      // 同步到 localStorage
      try {
        const saved = JSON.parse(localStorage.getItem('resumeai_result') || '{}');
        saved.html = currentHTML;
        localStorage.setItem('resumeai_result', JSON.stringify(saved));
      } catch(_) {}

      const reply = data.reply || '已更新页面 ✓';
      appendMessage('assistant', reply);
      chatHistory.push({ role: 'assistant', content: reply });
      saveChatHistory();

    } catch(e) {
      thinking.remove();
      appendMessage('assistant', '出错了：' + e.message);
    } finally {
      sendBtn.disabled = false;
    }
  }

  // ── boot ───────────────────────────────────────────────────────────────────
  init();
  loadChatHistory();
</script>
</body>
</html>
